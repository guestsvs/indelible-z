<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indelible Z — Crimson Vault Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Theme Variables */
            --bg-dark: #070406;
            --bg-panel: rgba(20, 10, 15, 0.85);
            --bg-card: rgba(28, 14, 21, 0.9);
            --bg-chat-recv: #180d14;
            --header-bg: rgba(7, 4, 6, 0.92);
            
            --crimson-accent: #e11d48;
            --crimson-light: #fda4af;
            --crimson-glow: rgba(225, 29, 72, 0.35);
            --border-crimson: rgba(225, 29, 72, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --gradient-crimson: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
            --gradient-sent: linear-gradient(135deg, #be123c 0%, #881337 100%);
            
            --text-main: #fff1f2;
            --text-secondary: #fda4af;
            --text-muted: #9f1239;
            --badge-bg: rgba(225, 29, 72, 0.15);
            --input-bg: rgba(7, 4, 6, 0.85);
        }

        [data-theme="light"] {
            /* Light Theme Variables */
            --bg-dark: #fcf8f9;
            --bg-panel: rgba(255, 255, 255, 0.9);
            --bg-card: rgba(255, 241, 243, 0.85);
            --bg-chat-recv: #fecdd3;
            --header-bg: rgba(255, 255, 255, 0.93);
            
            --crimson-accent: #e11d48;
            --crimson-light: #be123c;
            --crimson-glow: rgba(225, 29, 72, 0.18);
            --border-crimson: rgba(225, 29, 72, 0.2);
            --border-subtle: rgba(0, 0, 0, 0.08);
            
            --gradient-crimson: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            --gradient-sent: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
            
            --text-main: #1f1115;
            --text-secondary: #881337;
            --text-muted: #be123c;
            --badge-bg: rgba(225, 29, 72, 0.08);
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 10% 10%, var(--crimson-glow) 0px, transparent 45%),
                radial-gradient(at 90% 90%, var(--border-crimson) 0px, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-crimson);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            background: var(--gradient-crimson);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: #fff;
            box-shadow: 0 0 20px var(--crimson-glow);
        }

        .brand-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: var(--gradient-crimson);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-center-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--badge-bg);
            padding: 5px 12px;
            border-radius: 14px;
            border: 1px solid var(--border-crimson);
        }

        .file-input-hidden {
            display: none;
        }

        .btn-header-upload {
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid var(--border-crimson);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header-upload:hover {
            background: var(--crimson-accent);
            color: #fff;
            box-shadow: 0 0 15px var(--crimson-glow);
        }

        .header-right-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Arka Plan Müzik Çalar Kutusu */
        .bg-music-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--badge-bg);
            border: 1px solid var(--border-crimson);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .btn-music-action {
            background: rgba(225, 29, 72, 0.2);
            border: 1px solid var(--border-crimson);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-music-action:hover {
            background: var(--crimson-accent);
            color: #fff;
        }

        .music-title-display {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-volume-slider {
            width: 50px;
            accent-color: var(--crimson-accent);
            cursor: pointer;
        }

        .header-search-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .btn-toggle-search {
            background: var(--badge-bg);
            border: 1px solid var(--border-crimson);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-toggle-search:hover {
            background: var(--crimson-accent);
            color: #fff;
        }

        .expandable-search-input {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, margin 0.3s ease;
            background: var(--input-bg);
            border: 1px solid var(--border-crimson);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.82rem;
            outline: none;
            padding: 0;
            margin-left: 0;
            font-family: inherit;
        }

        .header-search-container.open .expandable-search-input {
            width: 200px;
            opacity: 1;
            padding: 0.5rem 0.85rem;
            margin-left: 8px;
        }

        .btn-theme-toggle {
            background: var(--badge-bg);
            border: 1px solid var(--border-crimson);
            color: var(--text-main);
            padding: 0.5rem 0.85rem;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-theme-toggle:hover {
            background: var(--crimson-accent);
            color: #fff;
        }

        .container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 1.75rem 1.5rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .tabs-grid-structured {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: var(--bg-panel);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-crimson);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(225, 29, 72, 0.15);
            border-color: var(--border-crimson);
        }

        .tab-btn.active {
            background: var(--gradient-crimson);
            color: #ffffff;
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 4px 18px var(--crimson-glow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-crimson);
            padding: 1.2rem 1.6rem;
            border-radius: 16px;
            backdrop-filter: blur(16px);
            transition: all 0.2s ease;
        }

        .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.9px;
            font-weight: 800;
            margin-bottom: 0.3rem;
        }

        .stat-counts-row {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-count-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-count-lbl {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .stat-date-val {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--crimson-accent);
        }

        .chat-section {
            background: var(--bg-panel);
            border: 1px solid var(--border-crimson);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 700px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            padding: 1rem 1.6rem;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-crimson);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .chat-header-badge {
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--badge-bg);
            color: var(--crimson-accent);
            border: 1px solid var(--border-crimson);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 68%;
        }

        .message-row.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .sender-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .message-bubble {
            padding: 0.85rem 1.2rem;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .message-row.sent .message-bubble {
            background: var(--gradient-sent);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message-row.received .message-bubble {
            background: var(--bg-chat-recv);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 4px;
        }

        .btn-goto-context {
            background: rgba(225, 29, 72, 0.25);
            border: 1px solid var(--crimson-accent);
            color: #fff;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ig-audio-player {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.65rem 0.95rem;
            border-radius: 22px;
            margin-top: 0.5rem;
            width: 260px;
            border: 1px solid var(--border-crimson);
        }

        .ig-play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient-crimson);
            border: none;
            color: #fff;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .ig-play-btn:hover {
            transform: scale(1.06);
        }

        .ig-waveform {
            flex: 1;
            height: 24px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .ig-bar {
            flex: 1;
            background: rgba(225, 29, 72, 0.4);
            border-radius: 3px;
            height: 40%;
            transition: height 0.2s, background-color 0.2s;
        }

        .ig-audio-player.playing .ig-bar {
            animation: wavePulse 1s infinite alternate ease-in-out;
            background: var(--crimson-accent);
        }

        @keyframes wavePulse {
            0% { height: 20%; }
            100% { height: 90%; }
        }

        .ig-duration {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: monospace;
        }

        .chat-photo {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 0.5rem;
            cursor: pointer;
            border: 1px solid var(--border-crimson);
        }

        .message-time {
            font-size: 0.65rem;
            opacity: 0.8;
            margin-top: 0.35rem;
            display: block;
            text-align: right;
        }

        .date-divider {
            text-align: center;
            margin: 1.2rem 0;
        }

        .date-divider span {
            background: var(--bg-panel);
            border: 1px solid var(--border-crimson);
            color: var(--text-secondary);
            padding: 0.3rem 0.85rem;
            border-radius: 18px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .voice-vault-grid, .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .voice-card {
            background: var(--bg-chat-recv);
            border: 1px solid var(--border-crimson);
            border-radius: 18px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            transition: all 0.25s ease;
        }

        .voice-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .gallery-item {
            background: var(--bg-card);
            border: 1px solid var(--border-crimson);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .gallery-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            cursor: pointer;
        }

        .gallery-meta {
            padding: 0.85rem 1rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Anı Odası - Kafaları Dengeleyen Hiza */
        .memory-room-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .memory-card-box {
            background: var(--bg-panel);
            border: 1px solid var(--crimson-accent);
            border-radius: 20px;
            padding: 2rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 45px var(--crimson-glow);
        }

        .memory-photo {
            width: 100%;
            height: 340px;
            object-fit: cover;
            object-position: center 25%;
            border-radius: 14px;
            filter: blur(12px) brightness(0.7);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .memory-photo:hover {
            filter: blur(0px) brightness(1);
        }

        .memory-quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-top: 1.5rem;
        }

        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--crimson-accent);
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 10px; }
            .tabs-grid-structured { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <div class="brand-badge">Z</div>
            <div class="brand-title">
                <h1>INDELIBLE Z</h1>
                <p>Digital Chat & Media Archive</p>
            </div>
        </div>

        <div class="header-center-actions">
            <input type="file" id="fileMainInput" class="file-input-hidden" accept=".json">
            <button class="btn-header-upload" onclick="document.getElementById('fileMainInput').click()">
                💬 Main Mesajları Seç
            </button>

            <input type="file" id="filePrivInput" class="file-input-hidden" accept=".json">
            <button class="btn-header-upload" onclick="document.getElementById('filePrivInput').click()">
                🔒 Priv Mesajları Seç
            </button>
        </div>

        <div class="header-right-controls">
            <!-- Arka Plan Müzik Çaları -->
            <div class="bg-music-player">
                <button class="btn-music-action" onclick="prevMusic()">⏮️</button>
                <button class="btn-music-action" id="btnBgMusicPlay" onclick="toggleBgMusic()">▶</button>
                <button class="btn-music-action" onclick="nextMusic()">⏭️</button>
                <span class="music-title-display" id="bgMusicTitle">Müzik 1</span>
                <input type="range" class="music-volume-slider" min="0" max="1" step="0.05" value="0.4" oninput="setBgMusicVolume(this.value)">
                <audio id="bgAudio" src="./muzik1.mp3" preload="metadata"></audio>
            </div>

            <div class="header-search-container" id="headerSearchBox">
                <button class="btn-toggle-search" onclick="toggleSearchBox()">
                    🔍 <span>Ara</span>
                </button>
                <input type="text" id="searchInput" class="expandable-search-input" placeholder="Sohbette içerik ara..." oninput="filterMessages()">
            </div>

            <button class="btn-theme-toggle" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="tabs-grid-structured">
            <button class="tab-btn active" id="tabMain" onclick="switchTab('main')">💬 Main Account</button>
            <button class="tab-btn" id="tabPriv" onclick="switchTab('priv')">🔒 Private Account</button>
            <button class="tab-btn" id="tabPhotos" onclick="switchTab('photos')">🖼️ Media Gallery</button>
            <button class="tab-btn" id="tabVoice" onclick="switchTab('voice')">🔊 Sesli Mesajlar</button>
            <button class="tab-btn" id="tabMemory" onclick="switchTab('memory')">🏛️ Anı Odası</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Toplam İleti İstatistikleri</div>
                <div class="stat-counts-row">
                    <div class="stat-count-item">
                        <span class="stat-count-val" id="statTextCount">0</span>
                        <span class="stat-count-lbl">💬 Mesaj Sayısı</span>
                    </div>
                    <div class="stat-count-item">
                        <span class="stat-count-val" id="statVoiceCount" style="color: var(--crimson-accent);">0</span>
                        <span class="stat-count-lbl">🔊 Ses Sayısı</span>
                    </div>
                    <div class="stat-count-item">
                        <span class="stat-count-val" id="statPhotoCount" style="color: #fb7185;">0</span>
                        <span class="stat-count-lbl">🖼️ Fotoğraf Sayısı</span>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Başlangıç Tarihi</div>
                <div class="stat-date-val" id="statFirstDate">Yükleniyor...</div>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <div class="chat-header-title-group">
                    <div class="chat-header-title" id="chatTitle">💬 Main Account Archive</div>
                    <div class="chat-header-badge">🔒 Encrypted Vault</div>
                </div>
            </div>
            <div class="chat-body" id="chatBody"></div>
        </div>
    </div>

    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img src="" class="lightbox-content" id="lightboxImg" alt="">
    </div>

    <script>
        let mainMessages = [];
        let privMessages = [];
        let activeTab = 'main';

        // Arka Plan Müzik Listesi
        const musicPlaylist = [
            { name: "Müzik 1", src: "./muzik1.mp3" },
            { name: "Müzik 2", src: "./muzik2.mp3" },
            { name: "Müzik 3", src: "./muzik3.mp3" }
        ];
        let currentMusicIndex = 0;

        function decodeLatin1ToUtf8(str) {
            try { return decodeURIComponent(escape(str)); } catch (e) { return str; }
        }

        function getMediaCandidatePaths(uri, type, source) {
            if (!uri) return [];
            const fileName = uri.split('/').pop();
            if (type === 'audio') {
                return (source === 'priv') 
                    ? [`./audio1/${fileName}`, `./audio/${fileName}`, `./${fileName}`]
                    : [`./audio2/${fileName}`, `./audio/${fileName}`, `./${fileName}`];
            } else if (type === 'photos') {
                return (source === 'priv') 
                    ? [`./photos1/${fileName}`, `./photos/${fileName}`, `./${fileName}`]
                    : [`./photos2/${fileName}`, `./photos/${fileName}`, `./${fileName}`];
            }
            return [`./${fileName}`];
        }

        window.addEventListener('DOMContentLoaded', () => {
            const fetchPriv = fetch('./message_1.json').then(r => r.ok ? r.json() : null).catch(() => null);
            const fetchMain = fetch('./message_2.json').then(r => r.ok ? r.json() : null).catch(() => null);

            Promise.all([fetchPriv, fetchMain]).then(([dataPriv, dataMain]) => {
                if (dataPriv && dataPriv.messages) privMessages = dataPriv.messages.reverse().map(m => ({ ...m, source: 'priv' }));
                if (dataMain && dataMain.messages) mainMessages = dataMain.messages.reverse().map(m => ({ ...m, source: 'main' }));
                if (privMessages.length === 0 && mainMessages.length === 0) renderFallbackNotice();
                else switchTab('main');
            });
        });

        document.getElementById('fileMainInput').addEventListener('change', (e) => loadManualFile(e, 'main'));
        document.getElementById('filePrivInput').addEventListener('change', (e) => loadManualFile(e, 'priv'));

        function loadManualFile(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const parsed = data.messages.reverse().map(m => ({ ...m, source: type }));
                    if (type === 'priv') privMessages = parsed;
                    else mainMessages = parsed;
                    switchTab(type);
                } catch (err) { alert('Dosya okunamadı!'); }
            };
            reader.readAsText(file);
        }

        function renderFallbackNotice() {
            document.getElementById('chatBody').innerHTML = `
                <div style="text-align:center; padding: 3rem; color: var(--text-secondary);">
                    <h3>⚠️ Otomatik Dosya Okuma Engellendi</h3>
                    <p style="margin-top: 10px;">Lütfen üstteki butonlardan <b>message_2.json</b> ve <b>message_1.json</b> dosyalarını yükleyin.</p>
                </div>`;
        }

        /* Müzik Çalar Fonksiyonları */
        function toggleBgMusic() {
            const audio = document.getElementById('bgAudio');
            const btn = document.getElementById('btnBgMusicPlay');
            if (audio.paused) {
                audio.play().then(() => { btn.innerText = '❚❚'; }).catch(() => {});
            } else {
                audio.pause();
                btn.innerText = '▶';
            }
        }

        function loadMusicTrack(idx) {
            currentMusicIndex = idx;
            const audio = document.getElementById('bgAudio');
            const title = document.getElementById('bgMusicTitle');
            const btn = document.getElementById('btnBgMusicPlay');
            audio.src = musicPlaylist[currentMusicIndex].src;
            title.innerText = musicPlaylist[currentMusicIndex].name;
            audio.play().then(() => { btn.innerText = '❚❚'; }).catch(() => { btn.innerText = '▶'; });
        }

        function nextMusic() {
            currentMusicIndex = (currentMusicIndex + 1) % musicPlaylist.length;
            loadMusicTrack(currentMusicIndex);
        }

        function prevMusic() {
            currentMusicIndex = (currentMusicIndex - 1 + musicPlaylist.length) % musicPlaylist.length;
            loadMusicTrack(currentMusicIndex);
        }

        function setBgMusicVolume(val) {
            document.getElementById('bgAudio').volume = val;
        }

        function toggleSearchBox() {
            const container = document.getElementById('headerSearchBox');
            container.classList.toggle('open');
            if (container.classList.contains('open')) {
                document.getElementById('searchInput').focus();
            }
        }

        function toggleTheme() {
            const body = document.body;
            const isLight = body.getAttribute('data-theme') === 'light';
            if (isLight) {
                body.removeAttribute('data-theme');
                document.getElementById('themeIcon').innerText = '🌙';
                document.getElementById('themeText').innerText = 'Dark';
            } else {
                body.setAttribute('data-theme', 'light');
                document.getElementById('themeIcon').innerText = '☀️';
                document.getElementById('themeText').innerText = 'Light';
            }
        }

        function switchTab(tab) {
            activeTab = tab;
            ['Main', 'Priv', 'Photos', 'Voice', 'Memory'].forEach(t => {
                document.getElementById(`tab${t}`).classList.toggle('active', tab === t.toLowerCase());
            });

            const titleEl = document.getElementById('chatTitle');
            if (tab === 'memory') { titleEl.innerHTML = '🏛️ Anı Odası'; renderMemoryRoom(); return; }
            if (tab === 'voice') { titleEl.innerHTML = '🔊 Sesli Mesajlar Vault'; renderVoiceVault(); return; }
            if (tab === 'photos') { titleEl.innerHTML = '🖼️ Media Gallery'; renderPhotoGallery(); return; }

            let currentList = (tab === 'priv') ? privMessages : mainMessages;
            titleEl.innerHTML = (tab === 'priv') ? '🔒 Private Account Archive' : '💬 Main Account Archive';

            if (currentList.length === 0) renderFallbackNotice();
            else { renderMessages(currentList); updateStats(currentList); }
        }

        function updateStats(list) {
            let text = 0, voice = 0, photo = 0;
            list.forEach(m => {
                if (m.audio_files) voice += m.audio_files.length;
                if (m.photos) photo += m.photos.length;
                if (m.content) text++;
            });
            document.getElementById('statTextCount').innerText = text.toLocaleString('tr-TR');
            document.getElementById('statVoiceCount').innerText = voice.toLocaleString('tr-TR');
            document.getElementById('statPhotoCount').innerText = photo.toLocaleString('tr-TR');
            if (list.length > 0) {
                document.getElementById('statFirstDate').innerText = new Date(list[0].timestamp_ms).toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });
            }
        }

        function renderMessages(messagesToRender, isSearchResults = false) {
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = '';
            const fragment = document.createDocumentFragment();
            let lastDateStr = '';

            messagesToRender.forEach((msg, idx) => {
                const msgDate = new Date(msg.timestamp_ms);
                const dateStr = msgDate.toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric' });

                if (dateStr !== lastDateStr && !isSearchResults) {
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = `<span>${dateStr}</span>`;
                    fragment.appendChild(divider);
                    lastDateStr = dateStr;
                }

                let rawSender = decodeLatin1ToUtf8(msg.sender_name || '');
                let displayName = (rawSender.toLowerCase().includes('ayaz') || rawSender.toLowerCase().includes('furkan')) ? 'Furkan' : 'Zeynep';
                let isSentByFurkan = (displayName === 'Furkan');

                const content = msg.content ? decodeLatin1ToUtf8(msg.content) : '';
                const timeStr = msgDate.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

                const msgRow = document.createElement('div');
                msgRow.className = `message-row ${isSentByFurkan ? 'sent' : 'received'}`;
                msgRow.id = `msg-${msg.originalIdx || idx}`;

                let mediaHtml = '';
                if (msg.photos) {
                    msg.photos.forEach(p => {
                        const candidates = getMediaCandidatePaths(p.uri, 'photos', msg.source);
                        mediaHtml += `<img src="${candidates[0]}" class="chat-photo" loading="lazy" onclick="openLightbox('${candidates[0]}')" onerror="tryNextMediaSource(this, ${JSON.stringify(candidates)})">`;
                    });
                }

                if (msg.audio_files && msg.audio_files.length > 0) {
                    msg.audio_files.forEach((a, aIdx) => {
                        const candidates = getMediaCandidatePaths(a.uri, 'audio', msg.source);
                        const playerUniqueId = `audio-${idx}-${aIdx}`;
                        
                        mediaHtml += `
                            <div class="ig-audio-player" id="player-${playerUniqueId}">
                                <button class="ig-play-btn" onclick="toggleCustomAudio('${playerUniqueId}')">▶</button>
                                <div class="ig-waveform">
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                    <div class="ig-bar"></div>
                                </div>
                                <span class="ig-duration" id="time-${playerUniqueId}">0:00</span>
                                <audio id="${playerUniqueId}" src="${candidates[0]}" preload="metadata" data-candidates='${JSON.stringify(candidates)}' data-cand-idx="0" onerror="handleAudioError(this)"></audio>
                            </div>
                        `;
                    });
                }

                const gotoBtn = isSearchResults ? `<br><button class="btn-goto-context" onclick="jumpToMessageContext(${msg.originalIdx})">📍 Sohbete Git (${dateStr})</button>` : '';

                msgRow.innerHTML = `
                    <div class="sender-name">${displayName}</div>
                    <div class="message-bubble">
                        ${content ? escapeHtml(content) : ''}
                        ${mediaHtml}
                        ${gotoBtn}
                        <span class="message-time">${timeStr}</span>
                    </div>`;
                fragment.appendChild(msgRow);
            });

            chatBody.appendChild(fragment);
            if (!isSearchResults) chatBody.scrollTop = chatBody.scrollHeight;
            setupAudioMetaData();
        }

        function handleAudioError(audioEl) {
            const candidates = JSON.parse(audioEl.getAttribute('data-candidates') || '[]');
            let currentIdx = parseInt(audioEl.getAttribute('data-cand-idx') || '0', 10);
            
            if (currentIdx + 1 < candidates.length) {
                currentIdx++;
                audioEl.setAttribute('data-cand-idx', currentIdx);
                audioEl.src = candidates[currentIdx];
                audioEl.load();
            } else {
                const player = document.getElementById(`player-${audioEl.id}`);
                if (player) {
                    player.style.opacity = '0.5';
                    player.querySelector('.ig-duration').innerText = 'Eksik Dosya';
                }
            }
        }

        function tryNextMediaSource(imgEl, candidates) {
            let currentSrc = imgEl.src;
            let currentIdx = candidates.findIndex(c => currentSrc.includes(c.replace('./', '')));
            if (currentIdx !== -1 && currentIdx + 1 < candidates.length) {
                imgEl.src = candidates[currentIdx + 1];
            } else {
                imgEl.remove();
            }
        }

        function toggleCustomAudio(id) {
            const audio = document.getElementById(id);
            const player = document.getElementById(`player-${id}`);
            const btn = player.querySelector('.ig-play-btn');

            document.querySelectorAll('audio').forEach(a => {
                if (a.id !== id && !a.paused) {
                    a.pause();
                    const p = document.getElementById(`player-${a.id}`);
                    if (p) {
                        p.classList.remove('playing');
                        p.querySelector('.ig-play-btn').innerText = '▶';
                    }
                }
            });

            if (audio.paused) {
                audio.play().then(() => {
                    player.classList.add('playing');
                    btn.innerText = '❚❚';
                }).catch(() => {
                    handleAudioError(audio);
                });
            } else {
                audio.pause();
                player.classList.remove('playing');
                btn.innerText = '▶';
            }

            audio.onended = () => {
                player.classList.remove('playing');
                btn.innerText = '▶';
            };

            audio.ontimeupdate = () => {
                const cur = Math.floor(audio.currentTime);
                const m = Math.floor(cur / 60);
                const s = cur % 60;
                const timeEl = document.getElementById(`time-${id}`);
                if (timeEl) timeEl.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            };
        }

        function setupAudioMetaData() {
            document.querySelectorAll('.ig-audio-player audio').forEach(audio => {
                audio.onloadedmetadata = () => {
                    const dur = Math.floor(audio.duration || 0);
                    const m = Math.floor(dur / 60);
                    const s = dur % 60;
                    const timeSpan = document.getElementById(`time-${audio.id}`);
                    if (timeSpan && !isNaN(dur)) {
                        timeSpan.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    }
                };
            });
        }

        function jumpToMessageContext(originalIdx) {
            const currentList = getCurrentList();
            renderMessages(currentList, false);
            setTimeout(() => {
                const target = document.getElementById(`msg-${originalIdx}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const bubble = target.querySelector('.message-bubble');
                    bubble.style.outline = '2px solid var(--crimson-accent)';
                    setTimeout(() => bubble.style.outline = 'none', 3000);
                }
            }, 100);
        }

        function renderVoiceVault() {
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = '';

            let allVoiceFiles = [];
            const combinedList = [...mainMessages, ...privMessages].sort((a,b) => a.timestamp_ms - b.timestamp_ms);

            combinedList.forEach((msg, idx) => {
                if (msg.audio_files && msg.audio_files.length > 0) {
                    let rawSender = decodeLatin1ToUtf8(msg.sender_name || '');
                    let sender = (rawSender.toLowerCase().includes('ayaz') || rawSender.toLowerCase().includes('furkan')) ? 'Furkan' : 'Zeynep';
                    
                    msg.audio_files.forEach((a, aIdx) => {
                        allVoiceFiles.push({
                            uri: a.uri,
                            timestamp: msg.timestamp_ms,
                            sender: sender,
                            source: msg.source,
                            id: `vault-audio-${idx}-${aIdx}`
                        });
                    });
                }
            });

            if (allVoiceFiles.length === 0) {
                renderFallbackNotice();
                return;
            }

            const vaultContainer = document.createElement('div');
            vaultContainer.className = 'voice-vault-grid';

            allVoiceFiles.forEach(v => {
                const vDate = new Date(v.timestamp).toLocaleDateString('tr-TR', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                const candidates = getMediaCandidatePaths(v.uri, 'audio', v.source);

                const card = document.createElement('div');
                card.className = 'voice-card';
                card.innerHTML = `
                    <div class="voice-card-header">
                        <span>👤 ${v.sender} (${v.source === 'main' ? 'Main' : 'Priv'})</span>
                        <span>📅 ${vDate}</span>
                    </div>
                    <div class="ig-audio-player" id="player-${v.id}" style="width: 100%;">
                        <button class="ig-play-btn" onclick="toggleCustomAudio('${v.id}')">▶</button>
                        <div class="ig-waveform">
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                            <div class="ig-bar"></div>
                        </div>
                        <span class="ig-duration" id="time-${v.id}">0:00</span>
                        <audio id="${v.id}" src="${candidates[0]}" preload="metadata" data-candidates='${JSON.stringify(candidates)}' data-cand-idx="0" onerror="handleAudioError(this)"></audio>
                    </div>
                `;
                vaultContainer.appendChild(card);
            });

            chatBody.appendChild(vaultContainer);
            setupAudioMetaData();
        }

        function renderPhotoGallery() {
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML = '';

            let allPhotos = [];
            const combinedList = [...mainMessages, ...privMessages].sort((a,b) => a.timestamp_ms - b.timestamp_ms);

            combinedList.forEach(msg => {
                if (msg.photos && msg.photos.length > 0) {
                    let rawSender = decodeLatin1ToUtf8(msg.sender_name || '');
                    let sender = (rawSender.toLowerCase().includes('ayaz') || rawSender.toLowerCase().includes('furkan')) ? 'Furkan' : 'Zeynep';
                    
                    msg.photos.forEach(p => {
                        allPhotos.push({
                            uri: p.uri,
                            timestamp: msg.timestamp_ms,
                            sender: sender,
                            source: msg.source
                        });
                    });
                }
            });

            if (allPhotos.length === 0) {
                renderFallbackNotice();
                return;
            }

            const galleryContainer = document.createElement('div');
            galleryContainer.className = 'gallery-grid';

            allPhotos.forEach(p => {
                const pDate = new Date(p.timestamp).toLocaleDateString('tr-TR', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                const candidates = getMediaCandidatePaths(p.uri, 'photos', p.source);

                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${candidates[0]}" class="gallery-img" loading="lazy" onclick="openLightbox('${candidates[0]}')" onerror="tryNextMediaSource(this, ${JSON.stringify(candidates)})">
                    <div class="gallery-meta">
                        <span>👤 ${p.sender} (${p.source === 'main' ? 'Main' : 'Priv'})</span>
                        <span>📅 ${pDate}</span>
                    </div>
                `;
                galleryContainer.appendChild(item);
            });

            chatBody.appendChild(galleryContainer);
        }

        function renderMemoryRoom() {
            document.getElementById('chatBody').innerHTML = `
                <div class="memory-room-container">
                    <div class="memory-card-box">
                        <img src="./Z.jpg" class="memory-photo" onclick="openLightbox(this.src)" onerror="this.src='./Z.jpeg';">
                        <div class="memory-quote">"Ben Kafirler Şehrinde Yalnız Kalmış bir Müslümanım. Sen Sesini Özlediğim Ezansın"</div>
                    </div>
                </div>`;
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        function getCurrentList() { return (activeTab === 'priv') ? privMessages : mainMessages; }

        function filterMessages() {
            if (['photos', 'memory', 'voice'].includes(activeTab)) return;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const currentList = getCurrentList();
            if (!query.trim()) { renderMessages(currentList, false); return; }
            const filtered = currentList.map((m, idx) => ({ ...m, originalIdx: idx })).filter(m => {
                return (m.content && decodeLatin1ToUtf8(m.content).toLowerCase().includes(query));
            });
            renderMessages(filtered, true);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
